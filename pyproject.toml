[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackboard-mcp"
version = "0.1.0"
description = "MCP server for UQ Blackboard Learn with Okta SSO support"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "playwright>=1.40",
    "httpx>=0.27",
    "pydantic>=2.0",
    "keyring>=24.0",
    "beautifulsoup4>=4.12",
]

[project.scripts]
blackboard-mcp = "blackboard_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blackboard_mcp"]

[tool.hatch.metadata]
allow-direct-references = true
